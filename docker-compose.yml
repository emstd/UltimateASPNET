services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=AwesomePass_1234
    restart: always
  ultimateaspnet:
    depends_on:
      - db
    image: emstd/ultimateaspnet:runtime
    build: 
      context: .
    ports:
      - "8080:5000"
      - "8081:5001"
    environment:
      - ASPNETCORE_Kestrel__Certificates__Default__Password=awesomepass
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/ultimateaspnet.pfx
      - ASPNETCORE_URLS=https://+:5001;http://+:5000
    volumes:
      - ${USERPROFILE}/.aspnet/https:/https/